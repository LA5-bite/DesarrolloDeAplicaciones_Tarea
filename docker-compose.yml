services:
  web:
    build: .
    container_name: aplicacion_web
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/data
    environment:
      - DJANGO_DEBUG=1
      - DJANGO_SECRET_KEY=dev-only-change-this-key
      - SQLITE_PATH=/data/db.sqlite3
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

volumes:
  sqlite_data:
